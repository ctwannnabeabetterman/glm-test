# Electron 打包配置 —— electron-builder
# 产物输出 release/；应用本体（asar 内仅桌面壳层脚本），
# 自包含的 Next standalone 服务与数据库模板经 extraResources 落在 resources/ 下。
appId: io.github.ctwannnabeabetterman.ai-network-lab
productName: AI Network Lab
# 版权/开发者信息（写进 exe 的文件属性与安装器元数据）。
# ⚠️ 刻意留**纯 ASCII**：这段字符串会被 NSIS 写进 LEGALCOPYRIGHT 版本信息，
# 一旦编码没对齐就是**静默**的乱码（构建照样成功）。中文署名放在零风险的位置：
# package.json 的 contributors（随 asar 一起分发）与应用内「使用说明」页。
copyright: Copyright (c) 2026 ctwannnabeabetterman. Developed with Ashu, AI engineering partner.
directories:
  output: release
  buildResources: desktop/build
files:
  - desktop/**/*
  - package.json
  # 壳层代码只有 desktop/ 下几个脚本，体积靠「不打进 node_modules」来保证。
  # 但 electron-updater 需要在壳里被 require（asar 内解析不到就静默降级为「无更新」），
  # 因此把它的依赖闭包重新包含回来 —— electron-builder 的 files 按顺序处理，
  # 后面的模式可以重新包含前面被 ! 排除的文件（见官方文档 Multiple Glob Patterns）。
  # 清单由 .recon/updater-deps.js 实际遍历 node_modules 依赖树得出；升级该依赖后请重跑。
  - '!node_modules/**/*'
  - 'node_modules/electron-updater/**/*'
  - 'node_modules/builder-util-runtime/**/*'
  - 'node_modules/fs-extra/**/*'
  - 'node_modules/graceful-fs/**/*'
  - 'node_modules/jsonfile/**/*'
  - 'node_modules/universalify/**/*'
  - 'node_modules/js-yaml/**/*'
  - 'node_modules/argparse/**/*'
  - 'node_modules/lazy-val/**/*'
  - 'node_modules/lodash.escaperegexp/**/*'
  - 'node_modules/lodash.isequal/**/*'
  - 'node_modules/semver/**/*'
  - 'node_modules/tiny-typed-emitter/**/*'
  - 'node_modules/debug/**/*'
  - 'node_modules/ms/**/*'
  - 'node_modules/sax/**/*'
asar: true

# 自动更新发布通道 —— electron-updater 在打包时会据此生成 resources/app-update.yml，
# 客户端启动后就是按这个地址去 GitHub Releases 找 latest.yml 判断有没有新版本。
#
# ⚠️ 这个 publish 段**必须留着**：它决定了 latest.yml 与 app-update.yml 会不会被生成，
#    与「谁负责上传」是两件事。
# ⚠️ 但 CI **不要**再用 `electron-builder --win --publish always` 上传（v1.3.0 / v1.3.1
#    连续两次踩坑后弃用）。2026-09-17 复盘出的真因是它的 `getOrCreateRelease()` 有竞态：
#    多个上传任务并发时各自 `createRelease()`，**同一个 tag 下会出现两个 Release**，
#    资产被拆到两个对象里（一个拿到 exe + latest.yml，另一个只拿到 blockmap）。
#    而 `/releases/tags/<tag>` 只返回其中一个 ⇒ 用户看到的 Release「只有 blockmap、没有安装包」，
#    实际上传从来没失败过。此外 electron-publish 还有若干「只 log.warn 就放弃」的静默分支
#    （目标 Release 发布超过 2 小时、构建出错时 cancelTasks()、token 取消等），同样不影响退出码。
#    现在 CI 用 `--publish never` 只构建，上传交给 gh CLI（显式创建一次 + 上传，不会产生孪生
#    Release，且失败必然非 0），见 .github/workflows/release.yml。
# ⚠️ 2026-09-21：provider 从 `github` 换成 `generic` —— 真因是「一次 504 就整次启动都不更新」。
#
# 用 github provider 时，electron-updater 每次检查都要**先拉 `releases.atom`** 判断最新 tag。
# 那个 feed 动态生成、不吃缓存，会偶发 5xx。实测用户机上的 update.log：
#   [15:23:58] [updater:error] HttpError: 504  GET .../releases.atom
# 而启动检查**只跑一次**（失败只写日志）⇒ 用户侧观感就是「客户端不会自动更新」。
# （同一次故障里，本机请求同一地址是 200 ⇒ GitHub 边缘节点的瞬时问题，不是仓库配置错。）
#
# generic provider 把 `latest.yml` 当普通文件取，**不经过 atom feed**：
#   channelUrl = newUrlFromBase(getChannelFilename('latest'), baseUrl)  → <url>/latest.yml
#   资产 URL   = resolveFiles(updateInfo)                               → <url>/<latest.yml 里的 path>
# 而 GitHub 的 `/releases/latest/download/<asset>` 恰好就是「最新正式 Release 的资产」这个语义，
# 所以两条 URL 都成立。实测（2026-09-21）：
#   GET .../releases/latest/download/latest.yml → 200，内容 `version: 1.3.11`
#   （发布核对脚本 .recon/out/release-check-138.py 每一版都在读同一个地址）
#
# ⚠️ publish 段本身仍然必须留着：它决定 latest.yml 与 resources/app-update.yml 会不会被生成，
#    与「谁负责上传」是两件事。CI 依旧 `--publish never` 只构建，上传交给 gh CLI（见 release.yml）。
# ⚠️ 这个改动**对已经在跑的旧客户端无效** —— 它们按各自那份 app-update.yml（写死的 github provider）
#    走；所以这次修复必须**先成功更新一次**（旧路径要能过）才会生效。
#
# 📌 历史坑（换掉 provider 之前踩过、现在仍然适用的那条）：github provider 的 `releaseType`
#    默认是 `draft`，而草稿 Release 在 GitHub 上既不是「latest」、匿名也访问不到 ⇒
#    electron-updater 请求 /releases/latest 期望 JSON、跟随跳转后拿到 406 ⇒
#    "Cannot parse releases feed"，检查更新永远失败。当时是靠显式写 `releaseType: release` 解决的。
#    现在 Create/Upload 都交给 CI 的 `gh release create`（**不带 --draft**），
#    并且每一版都用 `/releases/latest` 复核过它确实指向该 tag（见 .recon/out/release-check-138.py）——
#    这两条守卫不要去掉。
publish:
  - provider: generic
    # 对应仓库：ctwannnabeabetterman/glm-test
    # （generic provider 不再需要 owner/repo 两个字段 —— 下面 url 的路径里已经含了 owner 与 repo；
    #   package.json 的 repository 字段也记着同一个地址，别再让这处变成「找不到仓库」的孤岛。）
    url: https://github.com/ctwannnabeabetterman/glm-test/releases/latest/download
    channel: latest

extraResources:
  - from: resources/app.zip
    to: app.zip
  - from: resources/db-template
    to: db-template
win:
  target:
    - target: nsis
      arch: [x64]
  # 不设这个键时 electron-builder 会打日志 "default Electron icon is used"，
  # 装出来的程序在任务栏/开始菜单都是 Electron 默认的原子图标。
  # 图标由 `node scripts/make-icon.mjs` 生成：ico 内含 16/24/32/48/64/128/256 七个尺寸，
  # 其中 ≤32px 用「去连线」的简化几何 —— 完整版缩到 16px 时连线会把节点糊成一个十字。
  icon: build/icon.ico
  # Chromium 默认随包携带 55 个语言包（约 48 MB）。本应用界面为中文、
  # 英文作为兜底，只保留这两个即可，其余对用户不可见。
  # ⚠️ 键名必须是 electronLanguages。写成 locales 会让 JSON schema 校验失败、
  # 整个 win 段被拒（报错只说 "configuration.win should be null"，不指向具体字段，
  # 极难排查），且 CI 的发布 job 会以同样原因失败、安装包永远发不出来。
  electronLanguages:
    - zh-CN
    - en-US
nsis:
  oneClick: false
  perMachine: false
  # ⚠️ 必须 false。「单一版本」在安装器这一层同样要保证：
  # 允许改安装目录时，用户完全可以把 1.2.4 装到另一个目录，于是磁盘上同时存在
  # 两份不同版本 —— 它们共享同一个 userData 和同一个 SQLite 库（%APPDATA%\ai-network-lab），
  # 一旦先后启动就是两个写者，这正是「用多版本开并发」的入口。
  # 固定目录后：升级会直接覆盖旧版本（electron-builder 的 NSIS 在检出已安装版本时
  # 会沿用注册表里记录的目录），磁盘上永远只有一份 AI Network Lab。
  allowToChangeInstallationDirectory: false
  # ⚠️ 这里**不能带空格**（原先写的是 `${productName}-Setup-${version}.${ext}`，
  # 而 productName 是 "AI Network Lab"）。实测：磁盘上生成的文件名带空格，
  # 但传到 GitHub Release 后资产名里的空格被规范化成了连字符
  # （`AI Network Lab-Setup-1.3.0.exe.blockmap` → `AI-Network-Lab-Setup-1.3.0.exe.blockmap`）。
  # 而 electron-updater 是**照着 latest.yml 里记录的 path 去下载**的 —— 名字一旦对不上，
  # 更新就会在「下载」这一步 404 失败，而且失败得很难看懂。
  # 磁盘文件名、GitHub 资产名、latest.yml 里的 path 三者必须字面一致，所以去掉空格。
  artifactName: AI-Network-Lab-Setup-${version}.${ext}
  shortcutName: AI Network Lab
  # ⚠️ 保持 oneClick=false 有一个**代码侧的前置条件**（2026-09-17 排查「点击更新闪退」时确认）：
  #    app-builder-lib/templates/nsis/installSection.nsh 末尾，assisted 安装器
  #    「装完自动拉起应用」的条件是 `${if} ${isForceRun} ${andIf} ${Silent}` ——
  #    也就是说**只有静默安装（/S）才会把应用拉回来**；oneClick 安装器则不受此限制。
  #    所以 desktop/main.js 里必须 `autoUpdater.quitAndInstall(true, true)`，
  #    少传这两个参数就会变成「点更新 → 应用消失 → 版本没变」，而日志里一切正常。
  #    回归守卫见 tests/desktop/updater-contract.test.ts。
  #
  # ⚠️ 另一个与安装器有关的环境约束（同一次排查所得，与本配置文件无关但必须记下来）：
  #    更新时 NSIS 会先把 `$INSTDIR` 整个**改名**到 `$PLUGINSDIR\old-install`
  #    （uninstaller.nsh 的 `un.atomicRMDir`），失败就 `restoreFiles` + Abort。
  #    Windows 不允许改名一个「内部还有文件被别的进程打开」的目录 —— 只要有任何程序
  #    占着安装目录（把它当工作目录的编辑器/知识库工具、同步盘、索引、杀软），
  #    这一步就会卡住或中止，表现为：安装器窗口一直停着、应用下次启动 FATAL
  #    "Error loading V8 startup snapshot file"（目录被移动/半还原，快照文件不在原位）。
  #    实测现场：`%TEMP%\nsXXXX.tmp` 里留着 old-uninstaller.exe，安装器进程长期不退出。
  #    规避办法很简单：**不要把安装目录当工作目录/项目目录用**，安装前关掉占用它的程序。
  #    安装器卡死时若你不想等，可直接结束那个 `AI-Network-Lab-Setup-*.exe` 进程
  #    （它握着安装互斥量，不结束的话之后每次安装都会立刻中止）。
