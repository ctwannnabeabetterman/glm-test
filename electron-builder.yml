# Electron 打包配置 —— electron-builder
# 产物输出 release/；应用本体（asar 内仅桌面壳层脚本），
# 自包含的 Next standalone 服务与数据库模板经 extraResources 落在 resources/ 下。
appId: io.github.ctwannnabeabetterman.ai-network-lab
productName: AI Network Lab
directories:
  output: release
  buildResources: desktop/build
files:
  - desktop/**/*
  - package.json
  # 壳层代码只有 desktop/ 下几个脚本，体积靠「不打进 node_modules」来保证。
  # 但 electron-updater 需要在壳里被 require（asar 内解析不到就静默降级为「无更新」），
  # 因此把它的依赖闭包重新包含回来 —— electron-builder 的 files 按顺序处理，
  # 后面的模式可以重新包含前面被 ! 排除的文件（见官方文档 Multiple Glob Patterns）。
  # 清单由 .recon/updater-deps.js 实际遍历 node_modules 依赖树得出；升级该依赖后请重跑。
  - '!node_modules/**/*'
  - 'node_modules/electron-updater/**/*'
  - 'node_modules/builder-util-runtime/**/*'
  - 'node_modules/fs-extra/**/*'
  - 'node_modules/graceful-fs/**/*'
  - 'node_modules/jsonfile/**/*'
  - 'node_modules/universalify/**/*'
  - 'node_modules/js-yaml/**/*'
  - 'node_modules/argparse/**/*'
  - 'node_modules/lazy-val/**/*'
  - 'node_modules/lodash.escaperegexp/**/*'
  - 'node_modules/lodash.isequal/**/*'
  - 'node_modules/semver/**/*'
  - 'node_modules/tiny-typed-emitter/**/*'
  - 'node_modules/debug/**/*'
  - 'node_modules/ms/**/*'
  - 'node_modules/sax/**/*'
asar: true

# 自动更新发布通道 —— electron-updater 在打包时会据此生成 resources/app-update.yml，
# 客户端启动后就是按这个地址去 GitHub Releases 找 latest.yml 判断有没有新版本。
#
# ⚠️ 这个 publish 段**必须留着**：它决定了 latest.yml 与 app-update.yml 会不会被生成，
#    与「谁负责上传」是两件事。
# ⚠️ 但 CI **不要**再用 `electron-builder --win --publish always` 上传（v1.3.0 / v1.3.1
#    连续两次踩坑后弃用）。2026-09-17 复盘出的真因是它的 `getOrCreateRelease()` 有竞态：
#    多个上传任务并发时各自 `createRelease()`，**同一个 tag 下会出现两个 Release**，
#    资产被拆到两个对象里（一个拿到 exe + latest.yml，另一个只拿到 blockmap）。
#    而 `/releases/tags/<tag>` 只返回其中一个 ⇒ 用户看到的 Release「只有 blockmap、没有安装包」，
#    实际上传从来没失败过。此外 electron-publish 还有若干「只 log.warn 就放弃」的静默分支
#    （目标 Release 发布超过 2 小时、构建出错时 cancelTasks()、token 取消等），同样不影响退出码。
#    现在 CI 用 `--publish never` 只构建，上传交给 gh CLI（显式创建一次 + 上传，不会产生孪生
#    Release，且失败必然非 0），见 .github/workflows/release.yml。
publish:
  - provider: github
    owner: ctwannnabeabetterman
    repo: glm-test
    # ⚠️ 必须显式写成 release。electron-builder 的默认值是 `draft`，
    # 而草稿 release 在 GitHub 上既不是「latest」、匿名也访问不到：
    #   · /releases/latest 不再指向某个 tag（页面直接说「没有任何 release」）
    #   · electron-updater 的 getLatestTagName() 请求 /releases/latest 期望 JSON，
    #     跟随跳转后拿到 406 → 报 "Cannot parse releases feed" → 检查更新永远失败
    # 实测这条默认值就是「自动更新一直不生效」的真因：CI 每次都只产出草稿。
    releaseType: release

extraResources:
  - from: resources/app.zip
    to: app.zip
  - from: resources/db-template
    to: db-template
win:
  target:
    - target: nsis
      arch: [x64]
  # 不设这个键时 electron-builder 会打日志 "default Electron icon is used"，
  # 装出来的程序在任务栏/开始菜单都是 Electron 默认的原子图标。
  # 图标由 `node scripts/make-icon.mjs` 生成：ico 内含 16/24/32/48/64/128/256 七个尺寸，
  # 其中 ≤32px 用「去连线」的简化几何 —— 完整版缩到 16px 时连线会把节点糊成一个十字。
  icon: build/icon.ico
  # Chromium 默认随包携带 55 个语言包（约 48 MB）。本应用界面为中文、
  # 英文作为兜底，只保留这两个即可，其余对用户不可见。
  # ⚠️ 键名必须是 electronLanguages。写成 locales 会让 JSON schema 校验失败、
  # 整个 win 段被拒（报错只说 "configuration.win should be null"，不指向具体字段，
  # 极难排查），且 CI 的发布 job 会以同样原因失败、安装包永远发不出来。
  electronLanguages:
    - zh-CN
    - en-US
nsis:
  oneClick: false
  perMachine: false
  # ⚠️ 必须 false。「单一版本」在安装器这一层同样要保证：
  # 允许改安装目录时，用户完全可以把 1.2.4 装到另一个目录，于是磁盘上同时存在
  # 两份不同版本 —— 它们共享同一个 userData 和同一个 SQLite 库（%APPDATA%\ai-network-lab），
  # 一旦先后启动就是两个写者，这正是「用多版本开并发」的入口。
  # 固定目录后：升级会直接覆盖旧版本（electron-builder 的 NSIS 在检出已安装版本时
  # 会沿用注册表里记录的目录），磁盘上永远只有一份 AI Network Lab。
  allowToChangeInstallationDirectory: false
  # ⚠️ 这里**不能带空格**（原先写的是 `${productName}-Setup-${version}.${ext}`，
  # 而 productName 是 "AI Network Lab"）。实测：磁盘上生成的文件名带空格，
  # 但传到 GitHub Release 后资产名里的空格被规范化成了连字符
  # （`AI Network Lab-Setup-1.3.0.exe.blockmap` → `AI-Network-Lab-Setup-1.3.0.exe.blockmap`）。
  # 而 electron-updater 是**照着 latest.yml 里记录的 path 去下载**的 —— 名字一旦对不上，
  # 更新就会在「下载」这一步 404 失败，而且失败得很难看懂。
  # 磁盘文件名、GitHub 资产名、latest.yml 里的 path 三者必须字面一致，所以去掉空格。
  artifactName: AI-Network-Lab-Setup-${version}.${ext}
  shortcutName: AI Network Lab
