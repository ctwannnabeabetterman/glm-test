name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      # PrismaClient 在模块导入时实例化，构建期仅需一个合法的 SQLite 占位 DSN
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # PDF 导出（笔记 / 论文）要嵌入真正的中文字体，缺字体时 `buildSimplePdf` 会**显式抛错**
      # —— 这是刻意的，绝不静默产出一份只有拉丁字形的「中国字」PDF。
      # ubuntu runner 默认不带 CJK 字体，而 src/lib/library/pdf.ts 正是去
      # /usr/share/fonts/opentype/noto/ 找它；装上 `fonts-noto-cjk` 就有这个文件。
      - name: Install CJK font (PDF export embeds a real Chinese font)
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          # 断言代码里写死要找的那个文件真的在（候选列表见 src/lib/library/pdf.ts）。
          # 字体包布局一变，这里会直接点名路径失败 —— 2026-09-17 就是字体风味从 TrueType
          # 变成 CFF 后 PDF 断言红了，但报错完全指不到原因，白烧了一轮排查。
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc \
            || { echo "::error::CJK 字体不在预期路径，src/lib/library/pdf.ts 的候选列表需要同步更新"; exit 1; }
          fc-list | grep -i "noto sans cjk" | head -3 || true

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (sim engine + LLM gateway)
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # 同 verify job：中文字体缺失会让 PDF 导出的单测显式失败
      - name: Install CJK font (PDF export embeds a real Chinese font)
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          # 断言代码里写死要找的那个文件真的在（候选列表见 src/lib/library/pdf.ts）。
          # 字体包布局一变，这里会直接点名路径失败 —— 2026-09-17 就是字体风味从 TrueType
          # 变成 CFF 后 PDF 断言红了，但报错完全指不到原因，白烧了一轮排查。
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc \
            || { echo "::error::CJK 字体不在预期路径，src/lib/library/pdf.ts 的候选列表需要同步更新"; exit 1; }
          fc-list | grep -i "noto sans cjk" | head -3 || true

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests (fast fail before browser suite)
        run: npm test

      - name: Browser E2E (11 sections + key workflows)
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
