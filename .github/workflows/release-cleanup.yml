name: Release cleanup

# 删掉「发了但没发成」的残缺 Release（例如 v1.3.0 / v1.3.1：里面只有一个 .exe.blockmap）。
#
# 为什么需要它：残缺 Release 在页面上和平常版本长得一样，点进去却没有安装包可下，
# 而客户端 electron-updater 又是按 Release 资产来判断更新的 —— 留着一个「空壳 latest」
# 只会让人以为有包可下。删掉它比留着解释便宜。
#
# 行为：只删 Release，**保留 tag**（历史版本号不该消失，CHANGELOG 也还引用着它）。
#
# 用法：Actions → Release cleanup → Run workflow → 填 tag（逗号分隔，如 v1.3.0,v1.3.1）

on:
  workflow_dispatch:
    inputs:
      tags:
        description: '要删除 Release 的 tag，逗号分隔（例如 v1.3.0,v1.3.1）'
        required: true
        type: string
        # 不预填真实版本：删除必须由操作者明确选择目标；只删 Release、保留 tag。

permissions:
  contents: write

# 不允许在发布流程正上传/验收草稿时清理同一份 Release。
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete release records (tags kept)
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a tags <<< "$TAGS"
          validated=()
          for t in "${tags[@]}"; do
            t="${t//[[:space:]]/}"
            [[ -z "$t" ]] && continue
            if [[ ! "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf '无效的 tag：%s\n' "$t" >&2
              exit 1
            fi
            validated+=("$t")
          done
          if (( ${#validated[@]} == 0 )); then
            printf '没有有效的 tag\n' >&2
            exit 1
          fi
          # 先核查所有目标是否真的残缺，避免删完一半才发现列表里混入正常版本。
          for t in "${validated[@]}"; do
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$t")"
            if jq -e '(.assets | map(.name) | any(. == "latest.yml")) and (.assets | map(.name) | any(endswith(".exe"))) and (.assets | map(.name) | any(endswith(".exe.blockmap")))' <<< "$release" >/dev/null; then
              printf 'Release %s 的三项核心资产齐全，拒绝作为残缺版本删除\n' "$t" >&2
              exit 1
            fi
          done
          for t in "${validated[@]}"; do
            gh release delete "$t" --yes --repo "$GITHUB_REPOSITORY"
          done
          gh release list --repo "$GITHUB_REPOSITORY" --limit 10
